apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: router
spec:
  podSelector:
    matchLabels:
      app: router
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9093
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
